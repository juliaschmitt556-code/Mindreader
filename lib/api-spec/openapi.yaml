openapi: 3.1.0
info:
  title: ReplyMind API
  version: 1.0.0
  description: Stateless AI analysis API. Conversation history and preferences stay in the user's browser.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analysis:
    post:
      operationId: analyzeConversation
      summary: Analyze a conversation without storing it on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis and reply suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "502":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /replies/{id}/rewrite:
    post:
      operationId: rewriteReply
      summary: Rewrite a reply using the supplied context without server-side history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteInput"
      responses:
        "200":
          description: Rewritten reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplySuggestion"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "502":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
components:
  responses:
    ApiError:
      description: Request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ReplyTone:
      type: string
      enum: [natural, reassuring, calm, sweet, confident, short, playful, flirty, apologetic, romantic]
    PreviousMessage:
      type: object
      required: [speaker, content]
      properties:
        speaker:
          type: string
          enum: [me, them, unknown]
        content:
          type: string
          maxLength: 4000
    ConversationMessage:
      type: object
      required: [id, speaker, content, sequence, createdAt]
      properties:
        id:
          type: string
          format: uuid
        speaker:
          type: string
          enum: [me, them, unknown]
        content:
          type: string
        sequence:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    ReplySuggestion:
      type: object
      required: [id, tone, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tone:
          $ref: "#/components/schemas/ReplyTone"
        text:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
    AnalysisResult:
      type: object
      required: [id, conversationId, summary, tone, relationshipContext, intent, needsClarification, messages, suggestions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        summary:
          type: string
        tone:
          type: string
        relationshipContext:
          type: string
        intent:
          type: string
        needsClarification:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ReplySuggestion"
        createdAt:
          type: string
          format: date-time
    AnalyzeInput:
      type: object
      required: [conversationId]
      properties:
        conversationId:
          type: string
          format: uuid
        conversationText:
          type: string
          maxLength: 16000
        latestMessage:
          type: string
          maxLength: 4000
        contextClarification:
          type: string
          maxLength: 4000
        instruction:
          type: string
          maxLength: 1000
        previousMessages:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreviousMessage"
        screenshotBase64:
          type: string
          maxLength: 14000000
        screenshotContentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        screenshotFileName:
          type: string
          maxLength: 255
        tone:
          $ref: "#/components/schemas/ReplyTone"
        includeEmojis:
          type: boolean
    RewriteInput:
      type: object
      required: [originalText, conversationContext, tone, instruction]
      properties:
        originalText:
          type: string
          maxLength: 1000
        conversationContext:
          type: string
          maxLength: 16000
        tone:
          $ref: "#/components/schemas/ReplyTone"
        instruction:
          type: string
          maxLength: 200
        includeEmojis:
          type: boolean
    ConversationSummary:
      type: object
      required: [id, title, preview, messageCount, isArchived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        preview:
          type: [string, "null"]
        messageCount:
          type: integer
          minimum: 0
        isArchived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UploadedScreenshot:
      type: object
      required: [id, conversationId, fileName, contentType, size, objectPath, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
        objectPath:
          type: string
        createdAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [messages, analysis, screenshot]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ConversationMessage"
            analysis:
              oneOf:
                - $ref: "#/components/schemas/AnalysisResult"
                - type: "null"
            screenshot:
              oneOf:
                - $ref: "#/components/schemas/UploadedScreenshot"
                - type: "null"
    ConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    ConversationUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        isArchived:
          type: boolean
    UserPreference:
      type: object
      required: [defaultTone, includeEmojis, appearance]
      properties:
        defaultTone:
          $ref: "#/components/schemas/ReplyTone"
        includeEmojis:
          type: boolean
        appearance:
          type: string
          enum: [system, light, dark]
    PreferenceInput:
      type: object
      properties:
        defaultTone:
          $ref: "#/components/schemas/ReplyTone"
        includeEmojis:
          type: boolean
        appearance:
          type: string
          enum: [system, light, dark]
    UsageSummary:
      type: object
      required: [month, generations, generationLimit, imageAnalyses, imageAnalysisLimit, storageBytes, storageLimitBytes]
      properties:
        month:
          type: string
          format: date
        generations:
          type: integer
        generationLimit:
          type: integer
        imageAnalyses:
          type: integer
        imageAnalysisLimit:
          type: integer
        storageBytes:
          type: integer
        storageLimitBytes:
          type: integer